name: check
on: [push, pull_request]

jobs:
  proofs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Lean
        run: |
          curl -sSfL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Check every proof
        run: lake build
      - name: Install weave
        run: |
          gh release download -R Ataraxy-Labs/weave -p 'weave-driver-x86_64-unknown-linux-gnu.tar.gz' -O weave-driver.tgz
          mkdir -p bin && tar -xzf weave-driver.tgz -C bin
          echo "$PWD/bin" >> "$GITHUB_PATH"
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Does weave agree with the model?
        run: |
          weave-driver --version
          lake exe gencases 3000 | python3 diff/run.py
